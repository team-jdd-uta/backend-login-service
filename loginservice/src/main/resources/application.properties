spring.application.name=loginservice
server.port=${SERVER_PORT:8081}

# datasource pointing to source MariaDB (container mapped to host 3308)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3308/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# initialize schema on startup
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
cognito.client-id=${COGNITO_CLIENT_ID:}
cognito.region=${COGNITO_REGION:${AWS_REGION:ap-northeast-2}}
